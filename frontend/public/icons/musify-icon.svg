<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181C" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B7A" />
      <stop offset="100%" stop-color="#ED5564" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Accent Wave / Note -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(237, 85, 100, 0.2)" stroke-width="8" stroke-dasharray="8 12"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(237, 85, 100, 0.35)" stroke-width="12" />
  </g>

  <!-- Modern Music / Pulse Glyph -->
  <g fill="url(#coralGrad)">
    <rect x="180" y="210" width="24" height="92" rx="12" />
    <rect x="218" y="160" width="24" height="192" rx="12" />
    <rect x="256" y="130" width="24" height="252" rx="12" />
    <rect x="294" y="175" width="24" height="162" rx="12" />
    <rect x="332" y="225" width="24" height="62" rx="12" />
  </g>

  <!-- Glass Specular Highlight -->
  <path d="M 64 64 Q 256 0 448 64 Q 256 128 64 64 Z" fill="rgba(255,255,255,0.06)" />
</svg>
