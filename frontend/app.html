<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="Ad-free music player with synced lyrics" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Musify — Web Music Player</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="application-name" content="Musify" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Musify" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0B0B0C" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icons/musify-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preload Self-Hosted Instrument Fonts (Instrument Sans & Instrument Serif) -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/InstrumentSans-Variable.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/InstrumentSerif-Regular.woff2">

    <!-- Preconnect to image CDNs and Stream Backend for instant audio start -->
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
    <link rel="preconnect" href="https://yt3.googleusercontent.com" crossorigin>
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
    <link rel="dns-prefetch" href="https://yt3.googleusercontent.com">
    
    <!-- Neutralize Netlify Injected Badge & HUD Script -->
    <script>
      (function() {
        var removeHud = function() {
          var s = document.querySelector('script[data-nf-variant], script[src*="/.netlify/scripts/hud"]');
          if (s) {
            delete s.dataset.nfVariant;
            s.remove();
          }
          var frames = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[src*="netlify"], [class*="netlify"], [id*="netlify"], a[href*="netlify.com"]');
          frames.forEach(function(el) {
            if (el.tagName === 'IFRAME' || el.tagName === 'A') {
              el.remove();
            }
          });
        };
        removeHud();
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(removeHud);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeHud);
        window.addEventListener('load', removeHud);
      })();
    </script>
  </head>
  <body class="bg-[#141415] text-[#EDEDED] selection:bg-[#D92B38] selection:text-[#EDEDED]">
    <!-- Sentinel elements that force Netlify HUD to early-exit without rendering -->
    <div id="nl-badge-frame" style="display:none!important;position:absolute!important;width:0!important;height:0!important;pointer-events:none!important;opacity:0!important;" aria-hidden="true"></div>
    <div id="nl-hud-frame" style="display:none!important;position:absolute!important;width:0!important;height:0!important;pointer-events:none!important;opacity:0!important;" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA support (in production only, unregister on localhost to avoid stale cache)
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => {
              console.log('ServiceWorker registration error:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
